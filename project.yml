name: Music
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  Music:
    type: application
    platform: iOS
    sources:
      - MusicApp.swift
      - Studio.swift
      - Separator.swift
      - ORTBridge.c
      - ORTBridge.h
      - path: MODEL-LICENSE.txt
        buildPhase: resources
      - path: Build/ORT/LICENSE
        buildPhase: resources
    dependencies:
      - framework: Build/ORT/onnxruntime.xcframework
        embed: false
      - sdk: CoreML.framework
      - sdk: Accelerate.framework
      - sdk: Foundation.framework
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.anton86511.melband.music
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Build/ORT/Headers"
        SWIFT_OBJC_BRIDGING_HEADER: ORTBridge.h
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Build/Info.plist
      properties:
        CFBundleDisplayName: 音樂
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh-Hant
        UILaunchScreen: {}
        BGTaskSchedulerPermittedIdentifiers:
          - tw.anton86511.melband.music.separation.*
