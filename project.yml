name: Music
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  Music:
    type: application
    platform: iOS
    sources:
      - MusicApp.swift
      - Studio.swift
      - Separator.swift
      - MDX23CSeparator.swift
      - AudioImport.swift
      - Assets.xcassets
    dependencies:
      - sdk: CoreML.framework
      - sdk: Accelerate.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.anton86511.melband.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Build/Info.plist
      properties:
        CFBundleDisplayName: 音樂
        CFBundleShortVersionString: "1.7.0"
        CFBundleVersion: "10"
        CFBundleDevelopmentRegion: zh-Hant
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
